name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            numpy: ">=1.26,<2"
          - os: ubuntu-latest
            python: "3.13"
            numpy: ">=2,<3"
          - os: windows-latest
            python: "3.11"
            numpy: ">=2,<3"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]" "numpy${{ matrix.numpy }}"
      - name: Test simulator engine
        run: python -m pytest -q
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Run controller example
        run: python examples/network_demo.py
      - name: Run course example
        run: python examples/course_demo.py
      - name: Run evolution example and export champion
        run: python examples/evolution_demo.py --generations 3 --population 8 --max-steps 60 --output artifacts/evolution-smoke.json

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: neuroevolution
          POSTGRES_PASSWORD: neuroevolution
          POSTGRES_DB: neuroevolution_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuroevolution -d neuroevolution_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://neuroevolution:neuroevolution@localhost:5432/neuroevolution_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: docker compose -f compose.postgres.yml config --quiet
      - run: python -m pytest -q tests/server
